name: Crawl for PortMaster candidates

on:
  schedule:
    - cron: '0 0 * * SUN'  # Run this workflow every Sunday at 00:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run crawler
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python run.py

      # Commit the updated watchlist to `main` BEFORE publishing the report.
      # If the job dies right after this step, the tracked history is
      # already durable and nothing is lost or duplicated. If the publish
      # step ran first and this commit then failed, the public report would
      # be ahead of the durable state, and the next run would silently
      # re-discover/re-classify the same "new" repos again next week.
      - name: Commit updated watchlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/watchlist.json
          git diff --cached --quiet || git commit -m "Update watchlist"
          git push

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          publish_dir: ./build
